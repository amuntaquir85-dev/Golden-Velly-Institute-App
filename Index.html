<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GVI">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Golden Valley Institute — Management System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#f59e0b; --gold-dark:#d97706; --gold-light:#fbbf24;
  --gold-grad:linear-gradient(135deg,#f59e0b 0%,#fbbf24 50%,#d97706 100%);
  --navy:#0f172a; --navy-2:#1e293b; --navy-3:#334155;
  --slate:#64748b; --slate-2:#94a3b8; --slate-3:#cbd5e1; --slate-4:#e2e8f0; --slate-5:#f1f5f9;
  --bg:#f8fafc; --white:#fff;
  --emerald:#10b981; --emerald-light:#d1fae5;
  --rose:#f43f5e; --rose-light:#ffe4e6;
  --amber:#f59e0b; --amber-light:#fef3c7;
  --blue:#3b82f6; --blue-light:#dbeafe;
  --radius-sm:8px; --radius:12px; --radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 20px 50px rgba(0,0,0,.15);
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
*{font-family:'Inter','Segoe UI',-apple-system,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--navy);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--gold);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--slate-3);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--slate-2)}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
.sidebar{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:0;overflow:hidden;position:relative}
.sidebar::before{content:'';position:absolute;top:0;right:0;left:0;height:220px;background:radial-gradient(circle at 50% 0%,rgba(245,158,11,.25),transparent 70%);pointer-events:none}
.brand{padding:22px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);position:relative}
.brand-logo{width:44px;height:44px;border-radius:12px;background:var(--gold-grad);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 14px rgba(245,158,11,.4);flex-shrink:0}
.brand-name{font-size:15px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.brand-name span{display:block;color:var(--gold-light);font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;margin-top:3px}
.nav{padding:16px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.65);transition:var(--transition);cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(245,158,11,.15);color:var(--gold-light);font-weight:600;border-left:3px solid var(--gold)}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--rose);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:rgba(255,255,255,.4)}
.sidebar-footer b{color:var(--gold-light)}

.main{overflow-y:auto;background:var(--bg)}
.topbar{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--slate-4);padding:16px 32px;z-index:10;display:flex;align-items:center;gap:16px;padding-top:calc(16px + env(safe-area-inset-top))}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.topbar .subtitle{font-size:13px;color:var(--slate);margin-top:2px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:28px 32px 60px;max-width:1400px;margin:0 auto}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:var(--transition);white-space:nowrap;border:1px solid transparent}
.btn-primary{background:var(--gold-grad);color:#fff;box-shadow:0 2px 8px rgba(245,158,11,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(245,158,11,.5)}
.btn-secondary{background:var(--white);color:var(--navy);border-color:var(--slate-4)}
.btn-secondary:hover{background:var(--slate-5);border-color:var(--slate-3)}
.btn-danger{background:var(--rose);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-ghost{color:var(--slate);padding:6px 10px}
.btn-ghost:hover{background:var(--slate-5);color:var(--navy)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--slate);transition:var(--transition);font-size:15px}
.btn-icon:hover{background:var(--slate-5);color:var(--navy)}
.btn-icon.danger:hover{background:var(--rose-light);color:var(--rose)}

.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--slate-4);box-shadow:var(--shadow-sm);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid var(--slate-4);display:flex;align-items:center;gap:12px}
.card-title{font-size:15px;font-weight:700}
.card-body{padding:20px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:20px;border:1px solid var(--slate-4);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:var(--transition)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .label{font-size:12px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat-card .meta{font-size:12px;color:var(--slate);margin-top:6px}
.stat-card .icon-badge{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.stat-card.gold .value{color:var(--gold-dark)}
.stat-card.gold .icon-badge{background:var(--amber-light);color:var(--gold-dark)}
.stat-card.emerald .value{color:var(--emerald)}
.stat-card.emerald .icon-badge{background:var(--emerald-light);color:var(--emerald)}
.stat-card.rose .value{color:var(--rose)}
.stat-card.rose .icon-badge{background:var(--rose-light);color:var(--rose)}
.stat-card.blue .value{color:var(--blue)}
.stat-card.blue .icon-badge{background:var(--blue-light);color:var(--blue)}

.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:12px 16px;background:var(--slate-5);font-size:11.5px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--slate-4);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--slate-4);vertical-align:middle}
tbody tr{transition:var(--transition)}
tbody tr:hover{background:var(--slate-5)}
tbody tr:last-child td{border-bottom:none}
.cell-actions{display:flex;gap:2px;justify-content:flex-end}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:12.5px;font-weight:600;color:var(--navy)}
.form-group label .req{color:var(--rose)}
.form-group input,.form-group select,.form-group textarea{padding:10px 12px;border:1.5px solid var(--slate-4);border-radius:8px;font-size:13.5px;background:var(--white);transition:var(--transition);outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.form-group textarea{resize:vertical;min-height:80px;font-family:inherit}
.form-hint{font-size:11.5px;color:var(--slate)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge-success{background:var(--emerald-light);color:#047857}
.badge-warning{background:var(--amber-light);color:#92400e}
.badge-danger{background:var(--rose-light);color:#be123c}
.badge-info{background:var(--blue-light);color:#1e40af}

.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--white);border:1.5px solid var(--slate-4);border-radius:8px;transition:var(--transition)}
.search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,158,11,.12)}
.search-box input{flex:1;border:none;outline:none;font-size:13.5px;background:transparent}
.filter-bar select{padding:9px 12px;border:1.5px solid var(--slate-4);border-radius:8px;font-size:13px;background:var(--white);cursor:pointer;outline:none;transition:var(--transition)}
.filter-bar select:focus{border-color:var(--gold)}

.batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.batch-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--slate-4);padding:20px;transition:var(--transition);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.batch-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gold)}
.batch-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold-grad)}
.batch-name{font-size:16px;font-weight:800;margin-bottom:4px}
.batch-subject{font-size:12.5px;color:var(--slate);margin-bottom:14px}
.batch-info{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--navy-3)}
.batch-info div{display:flex;align-items:center;gap:8px}
.batch-stats{display:flex;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid var(--slate-4)}
.batch-stats .stat{text-align:left}
.batch-stats .stat-label{font-size:11px;color:var(--slate);margin-bottom:2px}
.batch-stats .stat-value{font-size:16px;font-weight:700}

.notice-grid{display:flex;flex-direction:column;gap:12px}
.notice-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--slate-4);padding:18px 20px;transition:var(--transition);border-left:4px solid var(--gold);box-shadow:var(--shadow-sm)}
.notice-card:hover{box-shadow:var(--shadow)}
.notice-card.high{border-left-color:var(--rose)}
.notice-card.medium{border-left-color:var(--amber)}
.notice-card.low{border-left-color:var(--blue)}
.notice-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.notice-title{font-size:14.5px;font-weight:700;flex:1;line-height:1.4}
.notice-body{font-size:13px;color:var(--navy-3);line-height:1.6;white-space:pre-wrap}
.notice-meta{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:11.5px;color:var(--slate)}
.notice-delete{margin-left:auto}

.empty{text-align:center;padding:60px 20px;color:var(--slate)}
.empty .emoji{font-size:52px;margin-bottom:12px;opacity:.5}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--navy)}
.empty p{font-size:13px;max-width:360px;margin:0 auto 16px;line-height:1.6}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:60px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:slideDown .25s cubic-bezier(.4,0,.2,1);max-height:calc(100vh - 120px);display:flex;flex-direction:column}
.modal.wide{max-width:720px}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--slate-4);display:flex;align-items:center;gap:12px}
.modal-header h2{font-size:17px;font-weight:800;flex:1;letter-spacing:-.01em}
.modal-close{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--slate);font-size:20px;transition:var(--transition)}
.modal-close:hover{background:var(--slate-5);color:var(--navy)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 24px;border-top:1px solid var(--slate-4);display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,60px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:var(--emerald)}
.toast.error{background:var(--rose)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--slate-4);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;transition:var(--transition);position:relative;top:1px}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--gold-dark);border-bottom-color:var(--gold)}

.att-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--slate-4);transition:var(--transition)}
.att-row:hover{background:var(--slate-5)}
.att-row:last-child{border-bottom:none}
.att-name{flex:1;font-weight:600;font-size:13.5px}
.att-phone{font-size:12px;color:var(--slate);margin-top:2px;font-weight:400}
.att-toggle{display:flex;gap:4px;background:var(--slate-5);padding:3px;border-radius:8px}
.att-btn{padding:7px 16px;border-radius:6px;font-size:12.5px;font-weight:700;color:var(--slate);transition:var(--transition)}
.att-btn:hover{background:rgba(0,0,0,.05)}
.att-btn.active.present{background:var(--emerald);color:#fff}
.att-btn.active.absent{background:var(--rose);color:#fff}
.att-btn.active.late{background:var(--amber);color:#fff}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1024px){.two-col{grid-template-columns:1fr}}

.recent-notice{padding:12px 14px;border-radius:8px;background:var(--slate-5);margin-bottom:8px;font-size:13px;cursor:pointer;transition:var(--transition);border-left:3px solid var(--gold)}
.recent-notice:hover{background:var(--amber-light)}
.recent-notice:last-child{margin-bottom:0}
.recent-notice .rn-title{font-weight:600;margin-bottom:3px}
.recent-notice .rn-date{font-size:11px;color:var(--slate)}

.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-action{padding:16px;background:var(--slate-5);border-radius:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:var(--transition);border:1.5px solid transparent}
.quick-action:hover{background:var(--white);border-color:var(--gold);transform:translateY(-1px)}
.quick-action .qa-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--white);box-shadow:var(--shadow-sm)}
.quick-action:hover .qa-icon{background:var(--amber-light)}
.quick-action .qa-text{font-size:13px;font-weight:600}

@media print{
  .sidebar,.topbar-actions,.btn,.filter-bar,.tabs,.bottom-nav,.install-banner,.splash{display:none!important}
  .app{display:block}
  .main{overflow:visible}
  .view{padding:0;max-width:100%}
  .card{box-shadow:none;border:none}
}

/* ================= APP MODE ================= */
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .45s ease,visibility .45s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{width:110px;height:110px;border-radius:26px;background:var(--gold-grad);display:grid;place-items:center;font-size:56px;box-shadow:0 20px 60px rgba(245,158,11,.4);animation:pop .7s cubic-bezier(.4,0,.2,1)}
.splash-title{color:#fff;font-size:24px;font-weight:800;margin-top:22px;letter-spacing:-.02em}
.splash-sub{color:var(--gold-light);font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;margin-top:6px}
.splash-loader{margin-top:32px;width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--slate-4);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--slate);transition:var(--transition);position:relative;-webkit-tap-highlight-color:transparent}
.bn-item.active{color:var(--gold-dark)}
.bn-item.active::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
.bn-item:active{transform:scale(.94)}
.bn-icon{font-size:20px;line-height:1}
.bn-label{font-size:10px;font-weight:600}

.install-banner{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:12px;right:12px;background:var(--white);border:1px solid var(--slate-4);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;z-index:45;box-shadow:0 10px 30px rgba(0,0,0,.15);animation:slideUpBanner .35s ease-out}
.install-banner.show{display:flex}
.install-icon{width:42px;height:42px;border-radius:12px;background:var(--gold-grad);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.install-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.install-text strong{font-size:13px;font-weight:700}
.install-text span{font-size:11.5px;color:var(--slate)}
@keyframes slideUpBanner{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}

.sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:95;display:none;align-items:flex-end;animation:fadeIn .2s ease-out}
.sheet-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--white);width:100%;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:slideUp .28s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:var(--slate-3);border-radius:2px;margin:0 auto 14px}
.sheet-header{font-size:16px;font-weight:800;padding:0 4px 4px;margin-bottom:12px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-grid button{padding:16px 8px;background:var(--slate-5);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--navy);transition:var(--transition);-webkit-tap-highlight-color:transparent}
.sheet-grid button:hover{background:var(--amber-light)}
.sheet-grid button:active{transform:scale(.96)}
.sheet-grid button .icon{font-size:24px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .25s;padding-top:env(safe-area-inset-top)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:grid!important}
  .view{padding:20px 16px calc(100px + env(safe-area-inset-bottom))}
  .topbar{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
  .form-grid{grid-template-columns:1fr}
  .quick-actions{grid-template-columns:1fr}
  .bottom-nav{display:flex}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:22px 22px 0 0;max-height:92vh}
  .modal-header{padding:16px 20px}
  .modal-body{padding:16px 20px}
  .modal-footer{padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
  .topbar-actions .btn-secondary{display:none}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
  .filter-bar{gap:8px}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat-card{padding:14px}
  .stat-card .value{font-size:22px}
}
@media (min-width:901px){
  .sidebar-toggle{display:none}
  .install-banner{bottom:24px;left:auto;right:24px;max-width:380px}
}
.sidebar-toggle{display:none;width:36px;height:36px;border-radius:8px;background:var(--navy);color:#fff;font-size:18px;place-items:center}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splash-logo">🎓</div>
  <div class="splash-title">Golden Valley</div>
  <div class="splash-sub">Institute</div>
  <div class="splash-loader"></div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">🎓</div>
      <div class="brand-name">
        <span id="brandName">Golden Valley</span>
        <span>Institute</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-route="dashboard"><span class="icon">📊</span><span>Dashboard</span></button>
      <button class="nav-item" data-route="students"><span class="icon">👥</span><span>Students</span><span class="badge" id="studentBadge" style="display:none">0</span></button>
      <button class="nav-item" data-route="batches"><span class="icon">📚</span><span>Batches</span></button>
      <button class="nav-item" data-route="attendance"><span class="icon">✅</span><span>Attendance</span></button>
      <button class="nav-item" data-route="fees"><span class="icon">💰</span><span>Fees</span><span class="badge" id="feeBadge" style="display:none">0</span></button>
      <button class="nav-item" data-route="notices"><span class="icon">📢</span><span>Notices</span></button>
      <button class="nav-item" data-route="settings"><span class="icon">⚙️</span><span>Settings</span></button>
    </nav>
    <div class="sidebar-footer">
      <b>GVI</b> · Management System<br>
      <span style="opacity:.7">v1.0 · Data saved locally</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="subtitle" id="pageSubtitle">Welcome back 👋</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨 Print</button>
        <button class="btn btn-primary btn-sm" id="quickAddBtn">+ Quick Add</button>

</div>

<!-- BOTTOM NAV (mobile) -->
<nav class="bottom-nav" id="bottomNav">
  <button class="bn-item active" data-route="dashboard"><span class="bn-icon">📊</span><span class="bn-label">Home</span></button>
  <button class="bn-item" data-route="students"><span class="bn-icon">👥</span><span class="bn-label">Students</span></button>
  <button class="bn-item" data-route="attendance"><span class="bn-icon">✅</span><span class="bn-label">Attendance</span></button>
  <button class="bn-item" data-route="fees"><span class="bn-icon">💰</span><span class="bn-label">Fees</span></button>
  <button class="bn-item" id="moreBtn"><span class="bn-icon">⋯</span><span class="bn-label">More</span></button>
</nav>

<!-- INSTALL BANNER -->
<div class="install-banner" id="installBanner">
  <div class="install-icon">📲</div>
  <div class="install-text">
    <strong>Install GVI App</strong>
    <span>Home screen pe add karo</span>
  </div>
  <button class="btn btn-primary btn-sm" id="installBtn">Install</button>
  <button class="btn-icon" id="installClose">✕</button>
</div>

<!-- MORE SHEET -->
<div class="sheet-overlay" id="moreSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">More Options</div>
    <div class="sheet-grid">
      <button data-route="batches"><span class="icon">📚</span><span>Batches</span></button>
      <button data-route="notices"><span class="icon">📢</span><span>Notices</span></button>
      <button data-route="settings"><span class="icon">⚙️</span><span>Settings</span></button>
      <button data-action="quickadd"><span class="icon">➕</span><span>Quick Add</span></button>
      <button data-action="print"><span class="icon">🖨</span><span>Print</span></button>
      <button data-action="install"><span class="icon">📲</span><span>Install</span></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const DB_KEY = 'gvi_data_v1';
const ROUTES = {
  dashboard: { title: 'Dashboard', subtitle: 'Institute overview' },
  students: { title: 'Students', subtitle: 'Manage enrolled students' },
  batches: { title: 'Batches', subtitle: 'Manage class batches' },
  attendance: { title: 'Attendance', subtitle: 'Mark daily attendance' },
  fees: { title: 'Fees', subtitle: 'Fee collection & history' },
  notices: { title: 'Notices', subtitle: 'Announcements & updates' },
  settings: { title: 'Settings', subtitle: 'Institute information & backup' }
};
const PAYMENT_MODES = ['Cash', 'UPI', 'Card', 'Bank Transfer', 'Cheque', 'Other'];

let state = loadState();
let currentRoute = 'dashboard';
let viewFilters = { studentSearch:'', studentBatch:'', feeTab:'pending', attBatch:'', attDate: todayISO() };

function $(s, r=document){ return r.querySelector(s); }
function $$(s, r=document){ return [...r.querySelectorAll(s)]; }
function uid(prefix, key){ state.counters[key]=(state.counters[key]||1000)+1; return prefix + state.counters[key]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtMoney(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
function haptic(ms=10){ if(navigator.vibrate) navigator.vibrate(ms); }
function toast(msg, type){ const el=$('#toast'); el.textContent=msg; el.className='toast show'+(type?' '+type:''); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2500); }

function loadState(){ try{ const raw=localStorage.getItem(DB_KEY); if(raw) return JSON.parse(raw); }catch(e){} return getDefaults(); }
function getDefaults(){ return { settings:{ name:'Golden Valley Institute', tagline:'Excellence Through Knowledge', address:'', phone:'', email:'', logo:'🎓' }, students:[], batches:[], attendance:{}, payments:[], notices:[], counters:{ student:1000, batch:100, payment:10000, notice:100 } }; }
function saveState(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(state)); updateBadges(); }catch(e){ toast('Save failed','error'); } }

function getBatch(id){ return state.batches.find(b=>b.id===id); }
function getStudent(id){ return state.students.find(s=>s.id===id); }
function batchStudents(id){ return state.students.filter(s=>s.batchId===id && s.active!==false); }
function studentPaid(id){ return state.payments.filter(p=>p.studentId===id).reduce((s,p)=>s+Number(p.amount||0),0); }
function studentBalance(s){ return Math.max(0, Number(s.totalFees||0) - studentPaid(s.id)); }
function todayAttendancePercent(){ const today=todayISO(); let present=0,total=0; Object.keys(state.attendance).forEach(key=>{ if(key.endsWith('|'+today)){ Object.values(state.attendance[key]).forEach(v=>{ total++; if(v==='P'||v==='L') present++; }); } }); return total?Math.round((present/total)*100):0; }
function totalPendingFees(){ return state.students.reduce((s,x)=>s+studentBalance(x),0); }

function updateBadges(){ const a=state.students.filter(s=>s.active!==false).length; const sb=$('#studentBadge'); if(sb){sb.textContent=a; sb.style.display=a?'inline-flex':'none';} const p=state.students.filter(s=>studentBalance(s)>0).length; const fb=$('#feeBadge'); if(fb){fb.textContent=p; fb.style.display=p?'inline-flex':'none';} }

function openModal({title, bodyHTML, onSave, saveLabel='Save', wide=false, hideSave=false}){
  const overlay = $('#modalOverlay');
  overlay.innerHTML = `
    <div class="modal${wide?' wide':''}">
      <div class="modal-header">
        <h2>${esc(title)}</h2>
        <button class="modal-close" data-close>✕</button>
      </div>
      <form id="modalForm">
        <div class="modal-body">${bodyHTML}</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close>Cancel</button>
          ${hideSave?'':`<button type="submit" class="btn btn-primary">${esc(saveLabel)}</button>`}
        </div>
      </form>
    </div>`;
  overlay.classList.add('open');
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  const form = overlay.querySelector('#modalForm');
  if (onSave){ form.addEventListener('submit', e=>{ e.preventDefault(); const fd=new FormData(form); const r=onSave(fd); if(r!==false) closeModal(); }); }
  setTimeout(()=>{ const f=overlay.querySelector('input:not([type=hidden]),select,textarea'); if(f) f.focus(); }, 50);
}
function closeModal(){ const o=$('#modalOverlay'); o.classList.remove('open'); o.innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#modalOverlay').classList.contains('open')) closeModal(); });

function navigate(route){ if(!ROUTES[route]) return; currentRoute=route; updateNav(); updateBottomNav(); render(); }
function updateNav(){ $$('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.route===currentRoute)); const info=ROUTES[currentRoute]; $('#pageTitle').textContent=info.title; $('#pageSubtitle').textContent=info.subtitle; }

function updateBottomNav(){
  const main = ['dashboard','students','attendance','fees'];
  $$('.bn-item[data-route]').forEach(el=>el.classList.toggle('active', el.dataset.route===currentRoute));
  $('#moreBtn')?.classList.toggle('active', !main.includes(currentRoute));
}

function render(){
  const view=$('#view');
  switch(currentRoute){
    case 'dashboard': view.innerHTML=renderDashboard(); attachDashboard(); break;
    case 'students': view.innerHTML=renderStudents(); attachStudents(); break;
    case 'batches': view.innerHTML=renderBatches(); attachBatches(); break;
    case 'attendance': view.innerHTML=renderAttendance(); attachAttendance(); break;
    case 'fees': view.innerHTML=renderFees(); attachFees(); break;
    case 'notices': view.innerHTML=renderNotices(); attachNotices(); break;
    case 'settings': view.innerHTML=renderSettings(); attachSettings(); break;
  }
  updateBadges();
}

function renderDashboard(){
  const active=state.students.filter(s=>s.active!==false).length;
  const batchCount=state.batches.length;
  const attPct=todayAttendancePercent();
  const pending=totalPendingFees();
  const recent=[...state.notices].slice(0,4);
  const today=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `
    <div style="margin-bottom:20px">
      <div style="font-size:24px;font-weight:800;letter-spacing:-.02em">Namaste 👋</div>
      <div style="color:var(--slate);font-size:13px;margin-top:4px">${esc(today)}</div>
    </div>
    <div class="stats-grid">
      <div class="stat-card gold"><div class="icon-badge">👥</div><div class="label">Active Students</div><div class="value">${active}</div><div class="meta">Enrolled & active</div></div>
      <div class="stat-card blue"><div class="icon-badge">📚</div><div class="label">Batches</div><div class="value">${batchCount}</div><div class="meta">Running classes</div></div>
      <div class="stat-card emerald"><div class="icon-badge">✅</div><div class="label">Today's Attendance</div><div class="value">${attPct}%</div><div class="meta">Across all batches</div></div>
      <div class="stat-card rose"><div class="icon-badge">💰</div><div class="label">Pending Fees</div><div class="value" style="font-size:22px">${fmtMoney(pending)}</div><div class="meta">${state.students.filter(s=>studentBalance(s)>0).length} students</div></div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-header"><div class="card-title">⚡ Quick Actions</div></div>
        <div class="card-body">
          <div class="quick-actions">
            <div class="quick-action" data-quick="add-student"><div class="qa-icon">👤</div><div class="qa-text">Add Student</div></div>
            <div class="quick-action" data-quick="add-batch"><div class="qa-icon">📚</div><div class="qa-text">New Batch</div></div>
            <div class="quick-action" data-quick="mark-att"><div class="qa-icon">✅</div><div class="qa-text">Mark Attendance</div></div>
            <div class="quick-action" data-quick="record-fee"><div class="qa-icon">💰</div><div class="qa-text">Record Payment</div></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">📢 Recent Notices</div><button class="btn btn-ghost btn-sm" data-goto="notices" style="margin-left:auto">View All →</button></div>
        <div class="card-body">
          ${recent.length?recent.map(n=>`
            <div class="recent-notice" style="border-left-color:${n.priority==='high'?'var(--rose)':n.priority==='medium'?'var(--amber)':'var(--blue)'}">
              <div class="rn-title">${esc(n.title)}</div>
              <div class="rn-date">${fmtDate(n.date)}</div>
            </div>`).join('')
            :`<div style="text-align:center;color:var(--slate);padding:20px 0;font-size:13px">No notices yet.<br><button class="btn btn-primary btn-sm" data-quick="add-notice" style="margin-top:10px">Create First Notice</button></div>`}
        </div>
      </div>
    </div>`;
}
function attachDashboard(){
  $$('[data-quick]').forEach(el=>el.addEventListener('click', ()=>{
    const a=el.dataset.quick;
    if(a==='add-student') openStudentForm();
    else if(a==='add-batch') openBatchForm();
    else if(a==='mark-att'){ viewFilters.attBatch=state.batches[0]?.id||''; navigate('attendance'); }
    else if(a==='record-fee') navigate('fees');
    else if(a==='add-notice') openNoticeForm();
  }));
  $$('[data-goto]').forEach(el=>el.addEventListener('click', ()=>navigate(el.dataset.goto)));
}

function renderStudents(){
  const q=viewFilters.studentSearch.toLowerCase();
  const bf=viewFilters.studentBatch;
  let list=state.students.filter(s=>s.active!==false);
  if(q) list=list.filter(s=>(s.name||'').toLowerCase().includes(q)||(s.phone||'').includes(q)||(s.parentName||'').toLowerCase().includes(q));
  if(bf) list=list.filter(s=>s.batchId===bf);
  const opts=state.batches.map(b=>`<option value="${b.id}" ${bf===b.id?'selected':''}>${esc(b.name)}</option>`).join('');
  return `
    <div class="filter-bar">
      <div class="search-box"><span>🔍</span><input id="studentSearch" placeholder="Search by name or phone…" value="${esc(viewFilters.studentSearch)}"></div>
      <select id="studentBatchFilter"><option value="">All Batches</option>${opts}</select>
      <button class="btn btn-primary" id="addStudentBtn">+ Add Student</button>
    </div>
    <div class="card">
      ${list.length?`
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Batch</th><th>Total</th><th>Balance</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>${list.map(s=>{
            const b=getBatch(s.batchId); const bal=studentBalance(s);
            return `<tr>
              <td><strong>${esc(s.id)}</strong></td>
              <td><div style="font-weight:600">${esc(s.name)}</div>${s.parentName?`<div style="font-size:11.5px;color:var(--slate)">Parent: ${esc(s.parentName)}</div>`:''}</td>
              <td>${esc(s.phone||'—')}</td>
              <td>${b?`<span class="badge badge-info">${esc(b.name)}</span>`:'<span style="color:var(--slate)">—</span>'}</td>
              <td>${fmtMoney(s.totalFees)}</td>
              <td>${bal>0?`<span class="badge badge-danger">${fmtMoney(bal)}</span>`:'<span class="badge badge-success">Paid ✓</span>'}</td>
              <td><div class="cell-actions"><button class="btn-icon" data-edit="${s.id}" title="Edit">✏️</button><button class="btn-icon danger" data-delete="${s.id}" title="Delete">🗑️</button></div></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`
        : renderEmpty('👥','No students yet','Add your first student to get started.')}
    </div>`;
}
function attachStudents(){
  const s=$('#studentSearch');
  if(s) s.addEventListener('input', e=>{
    viewFilters.studentSearch=e.target.value;
    const pos=e.target.selectionStart;
    $('#view').innerHTML=renderStudents(); attachStudents();
    const n=$('#studentSearch'); if(n){n.focus(); n.setSelectionRange(pos,pos);}
  });
  $('#studentBatchFilter')?.addEventListener('change', e=>{ viewFilters.studentBatch=e.target.value; render(); });
  $('#addStudentBtn')?.addEventListener('click', ()=>openStudentForm());
  $$('[data-edit]').forEach(el=>el.addEventListener('click', ()=>openStudentForm(el.dataset.edit)));
  $$('[data-delete]').forEach(el=>el.addEventListener('click', ()=>{
    if(!confirm('Delete this student?')) return;
    const id=el.dataset.delete;
    state.students=state.students.filter(s=>s.id!==id);
    state.payments=state.payments.filter(p=>p.studentId!==id);
    saveState(); render(); toast('Student deleted','success');
  }));
}
function openStudentForm(editId){
  if(!state.batches.length){ toast('Pehle ek batch banayein','error'); return openBatchForm(); }
  const s=editId?getStudent(editId):null;
  const opts=state.batches.map(b=>`<option value="${b.id}" ${s&&s.batchId===b.id?'selected':''}>${esc(b.name)} — ${esc(b.subject||'')}</option>`).join('');
  openModal({
    title: s?'Edit Student':'Add New Student',
    wide: true,
    bodyHTML: `
      <div class="form-grid">
        <div class="form-group"><label>Full Name <span class="req">*</span></label><input name="name" required value="${esc(s?.name||'')}" placeholder="e.g. Rahul Sharma"></div>
        <div class="form-group"><label>Phone <span class="req">*</span></label><input name="phone" required value="${esc(s?.phone||'')}" placeholder="10-digit mobile"></div>
        <div class="form-group"><label>Parent Name</label><input name="parentName" value="${esc(s?.parentName||'')}"></div>
        <div class="form-group"><label>Parent Phone</label><input name="parentPhone" value="${esc(s?.parentPhone||'')}"></div>
        <div class="form-group"><label>Batch <span class="req">*</span></label><select name="batchId" required><option value="">— Select —</option>${opts}</select></div>
        <div class="form-group"><label>Join Date</label><input name="joinDate" type="date" value="${esc(s?.joinDate||todayISO())}"></div>
        <div class="form-group"><label>Total Fees (₹) <span class="req">*</span></label><input name="totalFees" type="number" min="0" required value="${esc(s?.totalFees??'')}"></div>
        <div class="form-group"><label>Address</label><input name="address" value="${esc(s?.address||'')}"></div>
      </div>`,
    saveLabel: s?'Update':'Add Student',
    onSave: fd=>{
      const data={ name:fd.get('name').trim(), phone:fd.get('phone').trim(), parentName:fd.get('parentName').trim(), parentPhone:fd.get('parentPhone').trim(), batchId:fd.get('batchId'), joinDate:fd.get('joinDate')||todayISO(), totalFees:Number(fd.get('totalFees'))||0, address:fd.get('address').trim(), active:true };
      if(!data.name||!data.phone||!data.batchId){ toast('Name, phone, batch required','error'); return false; }
      if(s){ Object.assign(s,data); toast('Updated ✓','success'); } else { state.students.push({ id:uid('S','student'), ...data }); toast('Added ✓','success'); }
      saveState(); render();
    }
  });
}

function renderBatches(){
  return `
    <div class="filter-bar"><div style="flex:1"></div><button class="btn btn-primary" id="addBatchBtn">+ New Batch</button></div>
    ${state.batches.length?`
      <div class="batch-grid">${state.batches.map(b=>{
        const c=batchStudents(b.id).length;
        return `<div class="batch-card">
          <div style="display:flex;align-items:flex-start;gap:10px">
            <div style="flex:1"><div class="batch-name">${esc(b.name)}</div><div class="batch-subject">${esc(b.subject||'General')} · ${esc(b.teacher||'No teacher')}</div></div>
            <button class="btn-icon" data-batch-edit="${b.id}">✏️</button>
            <button class="btn-icon danger" data-batch-delete="${b.id}">🗑️</button>
          </div>
          <div class="batch-info">
            ${b.timing?`<div>🕐 ${esc(b.timing)}</div>`:''}
            ${b.days?`<div>📅 ${esc(b.days)}</div>`:''}
            ${b.monthlyFees?`<div>💰 ${fmtMoney(b.monthlyFees)}/month</div>`:''}
          </div>
          <div class="batch-stats">
            <div class="stat"><div class="stat-label">Students</div><div class="stat-value">${c}</div></div>
            <div class="stat" style="text-align:right"><div class="stat-label">Capacity</div><div class="stat-value">${b.capacity||'∞'}</div></div>
          </div>
        </div>`;
      }).join('')}</div>`
      : renderEmpty('📚','No batches yet','Create your first batch.')}
  `;
}
function attachBatches(){
  $('#addBatchBtn')?.addEventListener('click', ()=>openBatchForm());
  $$('[data-batch-edit]').forEach(el=>el.addEventListener('click', ()=>openBatchForm(el.dataset.batchEdit)));
  $$('[data-batch-delete]').forEach(el=>el.addEventListener('click', ()=>{
    const id=el.dataset.batchDelete; const c=batchStudents(id).length;
    if(c>0){ if(!confirm(`Batch has ${c} students. Delete anyway?`)) return; state.students.forEach(s=>{if(s.batchId===id) s.batchId='';}); }
    else if(!confirm('Delete batch?')) return;
    state.batches=state.batches.filter(b=>b.id!==id); saveState(); render(); toast('Deleted','success');
  }));
}
function openBatchForm(editId, cb){
  const b=editId?getBatch(editId):null;
  openModal({
    title: b?'Edit Batch':'Create New Batch', wide:true,
    bodyHTML: `
      <div class="form-grid">
        <div class="form-group"><label>Batch Name <span class="req">*</span></label><input name="name" required value="${esc(b?.name||'')}"></div>
        <div class="form-group"><label>Subject</label><input name="subject" value="${esc(b?.subject||'')}"></div>
        <div class="form-group"><label>Teacher</label><input name="teacher" value="${esc(b?.teacher||'')}"></div>
        <div class="form-group"><label>Timing</label><input name="timing" value="${esc(b?.timing||'')}" placeholder="6:00 AM – 8:00 AM"></div>
        <div class="form-group"><label>Days</label><input name="days" value="${esc(b?.days||'')}" placeholder="Mon–Sat"></div>
        <div class="form-group"><label>Monthly Fees (₹)</label><input name="monthlyFees" type="number" min="0" value="${esc(b?.monthlyFees??'')}"></div>
        <div class="form-group"><label>Capacity</label><input name="capacity" type="number" min="1" value="${esc(b?.capacity??'')}"></div>
      </div>`,
    saveLabel: b?'Update':'Create',
    onSave: fd=>{
      const data={ name:fd.get('name').trim(), subject:fd.get('subject').trim(), teacher:fd.get('teacher').trim(), timing:fd.get('timing').trim(), days:fd.get('days').trim(), monthlyFees:Number(fd.get('monthlyFees'))||0, capacity:Number(fd.get('capacity'))||0 };
      if(!data.name){ toast('Name required','error'); return false; }
      if(b){ Object.assign(b,data); toast('Updated ✓','success'); } else { state.batches.push({ id:uid('B','batch'), ...data }); toast('Created ✓','success'); }
      saveState(); render(); if(cb) cb();
    }
  });
}

function renderAttendance(){
  const bid=viewFilters.attBatch||state.batches[0]?.id||'';
  const date=viewFilters.attDate||todayISO();
  const list=bid?batchStudents(bid):[];
  const existing=state.attendance[bid+'|'+date]||{};
  if(!state.batches.length) return renderEmpty('📚','No batches','Pehle batch banayein.');
  return `
    <div class="filter-bar">
      <select id="attBatch">${state.batches.map(b=>`<option value="${b.id}" ${bid===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
      <input type="date" id="attDate" value="${date}" style="padding:9px 12px;border:1.5px solid var(--slate-4);border-radius:8px;font-size:13px;background:var(--white)">
      <div style="flex:1"></div>
      <button class="btn btn-secondary btn-sm" id="attMarkAll">✅ All Present</button>
      <button class="btn btn-primary btn-sm" id="attSave">💾 Save</button>
    </div>
    <div class="card">
      ${list.length?list.map(s=>{
        const st=existing[s.id]||'';
        return `<div class="att-row" data-student="${s.id}">
          <div style="flex:1"><div class="att-name">${esc(s.name)}</div><div class="att-phone">${esc(s.phone||'')}</div></div>
          <div class="att-toggle">
            <button class="att-btn ${st==='P'?'active present':''}" data-status="P">Present</button>
            <button class="att-btn ${st==='L'?'active late':''}" data-status="L">Late</button>
            <button class="att-btn ${st==='A'?'active absent':''}" data-status="A">Absent</button>
          </div>
        </div>`;
      }).join(''):renderEmpty('👥','No students in batch','Add students first.')}
    </div>`;
}
function attachAttendance(){
  $('#attBatch')?.addEventListener('change', e=>{ viewFilters.attBatch=e.target.value; render(); });
  $('#attDate')?.addEventListener('change', e=>{ viewFilters.attDate=e.target.value; render(); });
  $('#attMarkAll')?.addEventListener('click', ()=>{
    $$('.att-row').forEach(r=>{
      r.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('active','present','late','absent'));
      r.querySelector('[data-status="P"]')?.classList.add('active','present');
    });
  });
  $('#attSave')?.addEventListener('click', ()=>{
    const bid=viewFilters.attBatch||state.batches[0]?.id; const date=viewFilters.attDate||todayISO();
    if(!bid){ toast('No batch','error'); return; }
    const rec={}; let n=0;
    $$('.att-row').forEach(r=>{ const a=r.querySelector('.att-btn.active'); if(a){ rec[r.dataset.student]=a.dataset.status; n++; } });
    if(!n){ toast('Mark at least one','error'); return; }
    state.attendance[bid+'|'+date]=rec; saveState(); render(); toast(`Saved (${n}) ✓`,'success');
  });
  $$('.att-row').forEach(r=>{
    r.querySelectorAll('.att-btn').forEach(btn=>btn.addEventListener('click', ()=>{
      r.querySelectorAll('.att-btn').forEach(b=>b.classList.remove('active','present','late','absent'));
      const s=btn.dataset.status;
      btn.classList.add('active', s==='P'?'present':s==='L'?'late':'absent');
      haptic(8);
    }));
  });
}

function renderFees(){
  const t=viewFilters.feeTab;
  return `
    <div class="tabs">
      <button class="tab ${t==='pending'?'active':''}" data-feetab="pending">💳 Pending</button>
      <button class="tab ${t==='history'?'active':''}" data-feetab="history">📜 History</button>
    </div>
    ${t==='pending'?renderFeesPending():renderFeesHistory()}`;
}
function renderFeesPending(){
  const p=state.students.filter(s=>s.active!==false&&studentBalance(s)>0).map(s=>({s,bal:studentBalance(s),paid:studentPaid(s.id)})).sort((a,b)=>b.bal-a.bal);
  if(!p.length) return renderEmpty('🎉','All fees are clear!','Koi pending fees nahi hai.');
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Student</th><th>Batch</th><th>Total</th><th>Paid</th><th>Balance</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody>${p.map(({s,bal,paid})=>{
      const b=getBatch(s.batchId);
      return `<tr>
        <td><div style="font-weight:600">${esc(s.name)}</div><div style="font-size:11.5px;color:var(--slate)">${esc(s.phone)}</div></td>
        <td>${b?`<span class="badge badge-info">${esc(b.name)}</span>`:'—'}</td>
        <td>${fmtMoney(s.totalFees)}</td>
        <td style="color:var(--emerald);font-weight:600">${fmtMoney(paid)}</td>
        <td><span class="badge badge-danger">${fmtMoney(bal)}</span></td>
        <td><div class="cell-actions"><button class="btn btn-primary btn-sm" data-pay="${s.id}">💰 Pay</button><button class="btn-icon" data-wa="${s.id}">📱</button></div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div></div>`;
}
function renderFeesHistory(){
  const p=[...state.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!p.length) return renderEmpty('📜','No payments','Record a payment first.');
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Student</th><th>Amount</th><th>Mode</th><th>Note</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody>${p.map(x=>{
      const s=getStudent(x.studentId);
      return `<tr>
        <td>${fmtDate(x.date)}</td>
        <td>${s?esc(s.name):'<em>Deleted</em>'}</td>
        <td style="color:var(--emerald);font-weight:700">${fmtMoney(x.amount)}</td>
        <td><span class="badge badge-info">${esc(x.mode)}</span></td>
        <td style="color:var(--slate);font-size:12.5px">${esc(x.note||'—')}</td>
        <td><div class="cell-actions"><button class="btn-icon danger" data-del-pay="${x.id}">🗑️</button></div></td>
      </tr>`;
    }).join('')}</tbody>
  </table></div></div>`;
}
function attachFees(){
  $$('[data-feetab]').forEach(el=>el.addEventListener('click', ()=>{ viewFilters.feeTab=el.dataset.feetab; render(); }));
  $$('[data-pay]').forEach(el=>el.addEventListener('click', ()=>openPaymentForm(el.dataset.pay)));
  $$('[data-wa]').forEach(el=>el.addEventListener('click', ()=>{
    const s=getStudent(el.dataset.wa); if(!s) return;
    const bal=studentBalance(s);
    const msg=`Hello ${s.name}, ${state.settings.name} se fee reminder: Balance ${fmtMoney(bal)}. Kripya jald payment karein.`;
    const phone=(s.phone||'').replace(/\D/g,'');
    window.open(phone?`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  }));
  $$('[data-del-pay]').forEach(el=>el.addEventListener('click', ()=>{
    if(!confirm('Delete payment?')) return;
    state.payments=state.payments.filter(p=>p.id!==el.dataset.delPay);
    saveState(); render(); toast('Deleted','success');
  }));
}
function openPaymentForm(sid){
  const s=getStudent(sid); if(!s) return;
  const bal=studentBalance(s);
  openModal({
    title:`Payment — ${esc(s.name)}`,
    bodyHTML: `
      <div style="background:var(--slate-5);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:var(--slate)">Total:</span><strong>${fmtMoney(s.totalFees)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:var(--slate)">Paid:</span><strong style="color:var(--emerald)">${fmtMoney(studentPaid(s.id))}</strong></div>
        <div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid var(--slate-4)"><span style="color:var(--slate)">Balance:</span><strong style="color:var(--rose)">${fmtMoney(bal)}</strong></div>
      </div>
      <div class="form-grid">
        <div class="form-group"><label>Amount (₹) <span class="req">*</span></label><input name="amount" type="number" required min="1" max="${bal}" value="${bal}"></div>
        <div class="form-group"><label>Date <span class="req">*</span></label><input name="date" type="date" required value="${todayISO()}"></div>
        <div class="form-group"><label>Mode</label><select name="mode">${PAYMENT_MODES.map(m=>`<option>${m}</option>`).join('')}</select></div>
        <div class="form-group"><label>Note</label><input name="note"></div>
      </div>`,
    saveLabel:'Record',
    onSave: fd=>{
      const amount=Number(fd.get('amount'));
      if(!amount||amount<=0){ toast('Valid amount','error'); return false; }
      state.payments.push({ id:uid('P','payment'), studentId:sid, amount, date:fd.get('date'), mode:fd.get('mode'), note:fd.get('note').trim() });
      saveState(); render(); toast(`Recorded ${fmtMoney(amount)} ✓`,'success');
    }
  });
}

function renderNotices(){
  const list=[...state.notices].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `
    <div class="filter-bar"><div style="flex:1"></div><button class="btn btn-primary" id="addNoticeBtn">+ New Notice</button></div>
    ${list.length?`<div class="notice-grid">${list.map(n=>`
      <div class="notice-card ${n.priority||'medium'}">
        <div class="notice-head"><div class="notice-title">${esc(n.title)}</div><button class="btn-icon danger" data-notice-del="${n.id}">🗑️</button></div>
        <div class="notice-body">${esc(n.body)}</div>
        <div class="notice-meta"><span>📅 ${fmtDate(n.date)}</span><span class="badge badge-${n.priority==='high'?'danger':n.priority==='medium'?'warning':'info'}">${esc((n.priority||'medium').toUpperCase())}</span></div>
      </div>`).join('')}</div>`
      :renderEmpty('📢','No notices yet','Share announcements.')}`;
}
function attachNotices(){
  $('#addNoticeBtn')?.addEventListener('click', ()=>openNoticeForm());
  $$('[data-notice-del]').forEach(el=>el.addEventListener('click', ()=>{
    if(!confirm('Delete notice?')) return;
    state.notices=state.notices.filter(n=>n.id!==el.dataset.noticeDel);
    saveState(); render(); toast('Deleted','success');
  }));
}
function openNoticeForm(){
  openModal({
    title:'Create Notice', wide:true,
    bodyHTML:`
      <div class="form-grid full">
        <div class="form-group"><label>Title <span class="req">*</span></label><input name="title" required placeholder="e.g. Diwali Holiday"></div>
        <div class="form-group"><label>Message <span class="req">*</span></label><textarea name="body" required style="min-height:120px"></textarea></div>
        <div class="form-grid">
          <div class="form-group"><label>Priority</label><select name="priority"><option value="medium" selected>Medium</option><option value="high">High</option><option value="low">Low</option></select></div>
          <div class="form-group"><label>Date</label><input name="date" type="date" value="${todayISO()}"></div>
        </div>
      </div>`,
    saveLabel:'Post',
    onSave: fd=>{
      const title=fd.get('title').trim(); const body=fd.get('body').trim();
      if(!title||!body){ toast('Title & message required','error'); return false; }
      state.notices.push({ id:uid('N','notice'), title, body, priority:fd.get('priority'), date:fd.get('date')||todayISO() });
      saveState(); render(); toast('Posted ✓','success');
    }
  });
}

function renderSettings(){
  const s=state.settings;
  return `
    <div class="card" style="margin-bottom:20px">
      <div class="card-header"><div class="card-title">🏫 Institute Information</div></div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group"><label>Institute Name</label><input id="settingName" value="${esc(s.name)}"></div>
          <div class="form-group"><label>Tagline</label><input id="settingTagline" value="${esc(s.tagline)}"></div>
          <div class="form-group"><label>Phone</label><input id="settingPhone" value="${esc(s.phone)}"></div>
          <div class="form-group"><label>Email</label><input id="settingEmail" value="${esc(s.email)}" type="email"></div>
          <div class="form-group" style="grid-column:1/-1"><label>Address</label><input id="settingAddress" value="${esc(s.address)}"></div>
        </div>
        <div style="margin-top:16px;display:flex;justify-content:flex-end"><button class="btn btn-primary" id="saveSettings">💾 Save</button></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:20px">
      <div class="card-header"><div class="card-title">💾 Backup & Restore</div></div>
      <div class="card-body">
        <p style="color:var(--slate);font-size:13px;margin-bottom:16px">Data is device-local. Backup regularly.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" id="exportData">⬇ Download Backup</button>
          <button class="btn btn-secondary" id="importData">⬆ Restore</button>
          <button class="btn btn-danger" id="resetData">🗑 Reset All</button>
        </div>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">📊 Summary</div></div>
      <div class="card-body">
        <div class="stats-grid" style="margin:0">
          <div class="stat-card"><div class="label">Students</div><div class="value">${state.students.length}</div></div>
          <div class="stat-card"><div class="label">Batches</div><div class="value">${state.batches.length}</div></div>
          <div class="stat-card"><div class="label">Payments</div><div class="value">${state.payments.length}</div></div>
          <div class="stat-card"><div class="label">Notices</div><div class="value">${state.notices.length}</div></div>
        </div>
      </div>
    </div>`;
}
function attachSettings(){
  $('#saveSettings')?.addEventListener('click', ()=>{
    state.settings.name=$('#settingName').value.trim();
    state.settings.tagline=$('#settingTagline').value.trim();
    state.settings.phone=$('#settingPhone').value.trim();
    state.settings.email=$('#settingEmail').value.trim();
    state.settings.address=$('#settingAddress').value.trim();
    saveState();
    $('#brandName').textContent=state.settings.name||'Golden Valley';
    toast('Saved ✓','success');
  });
  $('#exportData')?.addEventListener('click', ()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gvi-backup-'+todayISO()+'.json'; a.click();
    URL.revokeObjectURL(a.href); toast('Downloaded ✓','success');
  });
  $('#importData')?.addEventListener('click', ()=>$('#importFile').click());
  $('#importFile')?.addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      try {
        const d=JSON.parse(ev.target.result);
        if(!d.students||!d.batches) throw new Error('Invalid');
        if(!confirm('Replace all data?')) return;
        state=d; saveState(); render(); toast('Restored ✓','success');
      } catch(err){ toast('Invalid file','error'); }
    };
    r.readAsText(f); e.target.value='';
  });
  $('#resetData')?.addEventListener('click', ()=>{
    if(!confirm('Delete ALL data? Cannot be undone.')) return;
    if(!confirm('Absolutely sure?')) return;
    state=getDefaults(); saveState(); render(); toast('Reset done','success');
  });
}

function renderEmpty(emoji,title,msg){
  return `<div class="empty"><div class="emoji">${emoji}</div><h3>${esc(title)}</h3><p>${esc(msg)}</p></div>`;
}

$('#quickAddBtn')?.addEventListener('click', ()=>{
  openModal({
    title:'Quick Add',
    bodyHTML:`<div style="display:grid;gap:10px">
      <button class="btn btn-secondary" data-quick="add-student" style="justify-content:flex-start;padding:14px 16px">👤 Add Student</button>
      <button class="btn btn-secondary" data-quick="add-batch" style="justify-content:flex-start;padding:14px 16px">📚 New Batch</button>
      <button class="btn btn-secondary" data-quick="add-notice" style="justify-content:flex-start;padding:14px 16px">📢 Create Notice</button>
    </div>`,
    hideSave:true, onSave:null
  });
  setTimeout(()=>{
    $$('#modalOverlay [data-quick]').forEach(el=>el.addEventListener('click', ()=>{
      closeModal(); const a=el.dataset.quick;
      if(a==='add-student') openStudentForm();
      else if(a==='add-batch') openBatchForm();
      else if(a==='add-notice') openNoticeForm();
    }));
  }, 30);
});

$('#sidebarToggle')?.addEventListener('click', ()=>$('#sidebar').classList.toggle('open'));
$$('.nav-item').forEach(el=>el.addEventListener('click', ()=>{
  navigate(el.dataset.route);
  if(window.innerWidth<=900) $('#sidebar').classList.remove('open');
}));

// ===================== BOTTOM NAV =====================
$$('.bn-item[data-route]').forEach(el=>el.addEventListener('click', ()=>{
  haptic(8); navigate(el.dataset.route);
}));
$('#moreBtn')?.addEventListener('click', ()=>{ haptic(8); $('#moreSheet').classList.add('open'); });
$('#moreSheet')?.addEventListener('click', e=>{ if(e.target.id==='moreSheet') $('#moreSheet').classList.remove('open'); });
$$('#moreSheet [data-route]').forEach(el=>el.addEventListener('click', ()=>{
  navigate(el.dataset.route); $('#moreSheet').classList.remove('open');
}));
$$('#moreSheet [data-action]').forEach(el=>el.addEventListener('click', ()=>{
  const a=el.dataset.action; $('#moreSheet').classList.remove('open');
  if(a==='print') window.print();
  else if(a==='install') promptInstall();
  else if(a==='quickadd') $('#quickAddBtn')?.click();
}));

// ===================== INSTALL PROMPT =====================
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e;
  if(!localStorage.getItem('gvi_install_dismissed')) $('#installBanner')?.classList.add('show');
});
async function promptInstall(){
  if(!deferredPrompt){
    toast('Use browser menu → Install app','info');
    return;
  }
  deferredPrompt.prompt();
  const { outcome }=await deferredPrompt.userChoice;
  deferredPrompt=null;
  $('#installBanner')?.classList.remove('show');
  if(outcome==='accepted') toast('Installed ✓','success');
}
$('#installBtn')?.addEventListener('click', promptInstall);
$('#installClose')?.addEventListener('click', ()=>{
  $('#installBanner')?.classList.remove('show');
  localStorage.setItem('gvi_install_dismissed','1');
});
if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
  $('#installBanner')?.classList.remove('show');
}

// ===================== INIT =====================
function init(){
  const s=state.settings;
  if(s.name) $('#brandName').textContent=s.name;
  if(s.logo) $('#brandLogo').textContent=s.logo;
  if(!viewFilters.attBatch && state.batches.length) viewFilters.attBatch=state.batches[0].id;
  updateNav(); updateBottomNav(); render(); updateBadges();
  setTimeout(()=>{ $('#splash')?.classList.add('hide'); }, 550);
  if(!state.students.length && !state.batches.length){
    setTimeout(()=>toast('Welcome! Start by creating a batch.','success'), 900);
  }
}
init();

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
console.log('%c✓ GVI App Ready','color:#f59e0b;font-weight:bold;font-size:14px');
})();
</script>
</body>
</html>
